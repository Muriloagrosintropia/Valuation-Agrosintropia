# Publica a calculadora no GitHub Pages a cada push no branch de desenvolvimento.
# Assim há uma URL pública sempre atualizada — sem precisar rodar nada localmente.
name: Deploy no GitHub Pages

on:
  push:
    branches:
      - claude/agrosintropia-valuation-calc-lf027n
  # Permite disparar manualmente pela aba "Actions" do GitHub.
  workflow_dispatch:

# Permissões necessárias para o deploy no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy por vez, sem cancelar um que esteja no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Gera o build de produção
        run: npm run build

      - name: Envia o artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
